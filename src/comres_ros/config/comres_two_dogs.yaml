# The central COMRES node (comres_ros/comres_node.py) and its link to the dogs (dog_link, below).
# Run them on the computer that reaches every dog and our VLM server. {robot} is replaced by each
# robot id; the topic defaults are what dog_link publishes. (Robots on the same ROS 2 instead:
# dog_link:=false, and find their names with `ros2 run comres_ros comres_discover`.)
# Numbers may be written as 60 or 60.0.
comres_node:
  ros__parameters:
    robot_ids: ["go2_1", "go2_2"]
    map_topic: "/{robot}/map"                # each robot's live SLAM map (SLAM Toolbox), not a costmap
    map_qos: "reliable"                      # "reliable" (latched or not) or "best_effort"
    world_frame: "world"                     # map_align places both dogs' maps in it (go2_1's map frame is the world)
    base_frame: ""                           # "": the first that exists of {robot}/base_footprint, {robot}/base_link, base_footprint, base_link
    nav_frame: ""                            # "": the robot's SLAM map frame (Nav2's global frame)
    nav_action: "/{robot}/navigate_to_pose"
    detection_topic: "/{robot}/detections"
    detection_type: "std_msgs/String"        # what dog_link publishes; direct: vision_msgs/Detection2DArray,
                                             # vision_msgs/Detection3DArray or yolo_msgs/DetectionArray

    # The planning grid: centred on the team's start, grid_width x grid_height metres, turned by
    # grid_yaw_deg so that its +y is what the hints and the VLM's picture call north (+x: east).
    # COMRES's parameters are in cells and were tuned for a 20-cell sensing range:
    # cell_size = (useful sensing range) / 20, e.g. 5 m -> 0.25 m.
    grid_auto_center: true
    grid_width: 60.0
    grid_height: 60.0
    grid_x0: -30.0                           # used only when grid_auto_center is false
    grid_y0: -30.0
    grid_yaw_deg: 0.0
    cell_size: 0.25
    occ_threshold: 65                        # SLAM value >= this: wall; <= free_threshold: free; between: unknown
    free_threshold: 25
    free_fraction: 0.5                       # share of a cell's samples that must be free
    robot_clearance: 0.25                    # cells whose centre is nearer an obstacle are walls: Nav2's
                                             # robot_radius (nav2_go2.yaml), so COMRES picks targets Nav2 can reach

    task: "search"                           # search (ends on a detection) or explore (ends on ~/stop or the time limit)
    hint: ""                                 # the search hint, as in the simulated experiments
    T_H: 100                                 # ticks between merges and plans (as in the paper)
    tick_seconds: 1.0                        # one tick = one simulator step; the simulator's robot moves one
                                             # cell per step: Nav2 max speed = cell_size / tick_seconds keeps that
    max_mission_seconds: 1800.0
    goal_clearance: 0.0                      # Nav2 goals at least this far from walls (moved by up to 0.5 m);
                                             # 0: robot_clearance already keeps every target clear for Nav2
    target_classes: ["backpack"]
    detection_min_score: 0.5
    detection_frames: 1                      # sightings in a row (each within 1 s of the last); 1: the Go2's
                                             # yoloDetector reports each object once

    vlm_base_url: "http://127.0.0.1:18765/v1"   # our server (COMRES-VLM serve_vlm.sh), e.g. the A5000 box
    vlm_model: "qwen3.8-27b"
    vlm_timeout: 90.0                        # seconds per VLM call
    fake_vlm: false                          # true: random valid plans, no server (dry runs only)
    run_dir: "~/comres_runs"
    auto_start: false                        # false: ros2 service call /comres_node/start std_srvs/srv/Trigger
                                             # one node runs one mission: restart it for the next

# The link to the dogs (comres_ros/dog_link.py; each dog runs dog_bridge.py): robots[i] is reached
# at hosts[i] ("address:port"; the Tailscale address works from anywhere).
dog_link:
  ros__parameters:
    robots: ["go2_1", "go2_2"]
    hosts: ["100.125.2.71:9100", "100.84.183.55:9100"]
map_align:                                   # comres_ros/map_align_node.py: the dogs' maps in world_frame
  ros__parameters:
    robots: ["go2_1", "go2_2"]               # the first one's map frame is the world
    world_frame: "world"
    map_topic: "/{robot}/map"
    base_frame: ""                           # "": the first that exists of {robot}/base_footprint, {robot}/base_link
    period: 1.0                              # s between filter updates
    search_period: 10.0                      # s between global searches while the maps grow
    max_conflict: 0.05                       # first fusion: share of go2_2's points contradicting go2_1's map,
    strong_max_conflict: 0.08                #   or up to 8% when at least 70% of go2_2's obstacles lie on
    strong_agree_share: 0.7                  #   go2_1's (two real Go2 maps, aligned: 5.5-5.7% at ~77%; see
                                             #   AlignmentFilter). To test on the robots on Saturday 2026-11-21.
    lost_after: 20.0                         # once fused: search again after this long without a fit
    fine_extent: 30.0                        # m: larger maps are searched on 0.2 m cells (0.1 m below)
    track_max_move: 2.0                      # once fused: follow the maps (their loop closures reshape
    track_max_turn_deg: 15.0                 #   them) within this of the published transform, while the
    track_max_conflict: 0.15                 #   estimate disagrees with go2_1's map this little
